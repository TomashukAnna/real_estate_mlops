services:
  api:
    image: ${API_IMAGE:-real-estate-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: real-estate-api
    env_file:
      - .env
    environment:
      # Яндекс Диск
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN}
      - YANDEX_DISK_BASE_PATH=${YANDEX_DISK_BASE_PATH:-/MLOps/real_estate}
      - YANDEX_MODEL_PATH=${YANDEX_MODEL_PATH:-models/model.pkl}
      - YANDEX_METADATA_PATH=${YANDEX_METADATA_PATH:-metadata/metadata.json}
    ports:
      - "8000:8000"
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: Dockerfile.bff
    container_name: real-estate-bff
    env_file:
      - .env
    environment:
      BFF_INFERENCE_API_URL: http://api:8000
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://host.docker.internal:5000}
      BFF_DATASET_PATH: data/processed/cleaned_data.csv
      BFF_PARAMS_PATH: params.yaml
      BFF_REGISTRY_RESULT_PATH: reports/registry_result.json
      # Яндекс Диск
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN}
      - YANDEX_DISK_BASE_PATH=${YANDEX_DISK_BASE_PATH:-/MLOps/real_estate}
      - YANDEX_DATASET_PATH=${YANDEX_DATASET_PATH:-data/processed/cleaned_data.csv}
    ports:
      - "8002:8002"
    volumes:
      - ./params.yaml:/app/params.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: real-estate-ui
    environment:
      STREAMLIT_BFF_URL: http://bff:8002
    ports:
      - "8080:8501"
    depends_on:
      - bff
    restart: unless-stopped

  drift:
    image: ${API_IMAGE:-real-estate-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: real-estate-drift
    env_file:
      - .env
    environment:
      # Яндекс Диск
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN}
      - YANDEX_DISK_BASE_PATH=${YANDEX_DISK_BASE_PATH:-/MLOps/real_estate}
    command:
      - python
      - -m
      - src.monitoring.drift_service
    ports:
      - "8001:8001"
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: real-estate-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.4
    container_name: real-estate-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: real-estate-loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    container_name: real-estate-promtail
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
