apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-estate-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: real-estate-prometheus
  template:
    metadata:
      labels:
        app: real-estate-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: real-estate-prometheus
spec:
  selector:
    app: real-estate-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
