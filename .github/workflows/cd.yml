name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: real-estate-mlops-api
  BFF_IMAGE_NAME: real-estate-mlops-bff
  UI_IMAGE_NAME: real-estate-mlops-ui

jobs:
  publish-images:
    name: Publish Docker Images
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image references
        id: images
        run: |
          echo "api=${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ env.API_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "bff=${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ env.BFF_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "ui=${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ env.UI_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.api }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.api }}:latest

      - name: Build and push BFF image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bff
          push: true
          tags: |
            ${{ steps.images.outputs.bff }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.bff }}:latest

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.ui }}:${{ steps.images.outputs.tag }}
            ${{ steps.images.outputs.ui }}:latest

      - name: Update Argo CD image tags
        run: |
          git fetch origin ${{ github.event.workflow_run.head_branch }}
          git checkout ${{ github.event.workflow_run.head_branch }}
          python - <<'PY'
          from pathlib import Path

          path = Path("k8s/overlays/argocd/kustomization.yaml")
          tag = "${{ steps.images.outputs.tag }}"
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = []
          for line in lines:
              if line.strip().startswith("newTag:"):
                  indent = line[: len(line) - len(line.lstrip())]
                  updated.append(f"{indent}newTag: {tag}")
              else:
                  updated.append(line)
          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          PY
          git add k8s/overlays/argocd/kustomization.yaml
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: update argocd image tags [skip ci]"
          git push origin HEAD:${{ github.event.workflow_run.head_branch }}
