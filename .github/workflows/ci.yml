name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: real-estate-api:ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 src/api tests

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Export Docker image
        run: docker save ${{ env.IMAGE_NAME }} -o real-estate-api-ci.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-api-ci-image
          path: real-estate-api-ci.tar
          retention-days: 1

  smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: real-estate-api-ci-image

      - name: Load Docker image
        run: docker load -i real-estate-api-ci.tar

      - name: Run smoke check
        run: |
          docker run -d --name real-estate-api-smoke -p 8000:8000 ${{ env.IMAGE_NAME }}
          sleep 8
          curl --fail http://127.0.0.1:8000/health
          docker logs real-estate-api-smoke
          docker rm -f real-estate-api-smoke
